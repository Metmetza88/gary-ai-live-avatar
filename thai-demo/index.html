<!doctype html><html lang="th"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CHAYLUEKLAB AI LIVE STUDIO</title><style>body{font:16px system-ui;background:#10141c;color:#eef2ff;margin:auto;max-width:720px;padding:20px}section{background:#202938;padding:18px;border-radius:16px;margin:16px 0}button,input,textarea{box-sizing:border-box;font:inherit;padding:12px;border-radius:8px;border:1px solid #657085;margin:5px 0}input,textarea{width:100%}button{background:#dbeafe;color:#111827}img{width:100%;max-height:360px;object-fit:contain}small{color:#b8c5d9}</style><h1>CHAYLUEKLAB AI LIVE STUDIO</h1><p>โหมดจำลองฟรี • ไม่เชื่อมต่อไลฟ์จริง</p><section><label>รูปตัวละคร <input id="photo" type="file" accept="image/*"></label><img id="avatar" hidden alt="รูปตัวละคร"><label>ชื่อตัวละคร<input id="name" value="ชายลึกลับ"></label><label>บทพูด<textarea id="script">สวัสดีครับ ยินดีต้อนรับเข้าสู่ไลฟ์</textarea></label><button id="speak">ทดลองพูด</button><button id="stop">หยุดเสียง</button><p id="status" role="status">พร้อมทดลอง</p></section><section><h2>จำลองคอมเมนต์</h2><input id="comment" placeholder="พิมพ์ข้อความผู้ชม"><button id="send">จำลองตอบกลับ</button><p id="reply" aria-live="polite"></p><small>คำตอบตามกฎ ไม่ใช่ AI สนทนาจริง รูปไม่ขยับปาก</small></section><script>const el=id=>document.getElementById(id);let url;el('photo').onchange=()=>{const f=el('photo').files[0];if(!f)return;if(url)URL.revokeObjectURL(url);url=URL.createObjectURL(f);el('avatar').src=url;el('avatar').hidden=false};function say(t){if(!('speechSynthesis'in window)){el('status').textContent='เบราว์เซอร์ไม่รองรับเสียง';return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='th-TH';u.onend=()=>el('status').textContent='พูดจบแล้ว';u.onerror=()=>el('status').textContent='เล่นเสียงไม่ได้ กรุณาตรวจสอบเสียงภาษาไทย';el('status').textContent='กำลังพูด';speechSynthesis.speak(u)}el('speak').onclick=()=>say(el('script').value);el('stop').onclick=()=>{if('speechSynthesis'in window)speechSynthesis.cancel();el('status').textContent='หยุดแล้ว'};el('send').onclick=()=>{const t=el('comment').value.trim();if(!t)return;const r=/สวัสดี|หวัดดี/.test(t)?'สวัสดีครับ ยินดีต้อนรับ':/ราคา/.test(t)?'ขอบคุณที่สนใจครับ ยังไม่ได้ตั้งราคาสินค้า':'ขอบคุณสำหรับข้อความครับ';el('reply').textContent=el('name').value+': '+r;say(r)};</script></html>
